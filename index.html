<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pio Surprise</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: #ffe6f0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: clamp(28px, 6vw, 36px);
      margin-bottom: 60px;
    }

    .buttons {
      position: relative;
      width: 100%;
      height: 160px;
    }

    button {
      width: 140px;
      height: 56px;
      font-size: 20px;
      border: none;
      border-radius: 14px;
      color: white;
      cursor: pointer;
      touch-action: manipulation;
    }

    #jelek {
      background: #ff6b6b;
      position: absolute;
      left: 10px;
      top: 50px;
    }

    #cantik {
      background: #4CAF50;
      position: absolute;
      right: 10px;
      top: 50px;
    }

    /* Popup */
    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .popup-content {
      width: 320px;
      height: 320px;
      background: white;
      border-radius: 28px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
      text-align: center;
    }

    .popup-content p {
      font-size: 18px;
    }

    .popup-content button {
      width: 100%;
      height: 54px;
      font-size: 18px;
      background: #25D366;
      border-radius: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Pio itu cantik atau jelek?</h1>

    <div class="buttons" id="area">
      <button id="jelek">Jelek</button>
      <button id="cantik">Cantik</button>
    </div>
  </div>

  <!-- Popup -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <p>
        nah gitu dong mengakui😁<br>
        klik kirim pesan sekarang ke adam, untuk mengakui.
      </p>
      <button id="kirim">Kirim Pesan</button>
    </div>
  </div>

  <!-- Sound -->
  <audio id="soundJelek" src="assets/audio/dodge.mp3"></audio>
  <audio id="soundCantik" src="assets/audio/success.mp3"></audio>

  <!-- Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    const jelek = document.getElementById("jelek");
    const cantik = document.getElementById("cantik");
    const popup = document.getElementById("popup");
    const kirim = document.getElementById("kirim");
    const area = document.getElementById("area");

    const sJelek = document.getElementById("soundJelek");
    const sCantik = document.getElementById("soundCantik");

    function pindahJelek() {
      sJelek.currentTime = 0;
      sJelek.play();

      const areaW = area.clientWidth;
      const areaH = area.clientHeight;

      const maxX = areaW / 2 - jelek.offsetWidth - 10;
      const maxY = areaH - jelek.offsetHeight;

      const x = Math.random() * Math.max(maxX, 20);
      const y = Math.random() * Math.max(maxY, 20);

      jelek.style.left = `${x}px`;
      jelek.style.top = `${y}px`;
    }

    // UNLIMITED spam (mouse + touch)
    jelek.addEventListener("pointerdown", pindahJelek);

    cantik.addEventListener("click", () => {
      sCantik.play();
      popup.style.display = "flex";

      confetti({
        particleCount: 140,
        angle: 60,
        spread: 80,
        origin: { x: 0 }
      });

      confetti({
        particleCount: 140,
        angle: 120,
        spread: 80,
        origin: { x: 1 }
      });
    });

    kirim.addEventListener("click", () => {
      const pesan = encodeURIComponent("Iya papa sayang, mama cantik kok ❤️");
      window.location.href =
        "https://wa.me/628137902804?text=" + pesan;
    });

    popup.addEventListener("click", e => {
      if (e.target === popup) popup.style.display = "none";
    });
  </script>

</body>
</html>
