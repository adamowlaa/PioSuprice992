<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pio Surprise</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ffe6f0;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 50px;
        }

        .buttons {
            position: relative;
            width: 100%;
            height: 120px;
        }

        button {
            font-size: 20px;
            padding: 16px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #jelek {
            background: #ff6b6b;
            color: white;
            position: absolute;
            left: 0;
            top: 30px;
        }

        #cantik {
            background: #4CAF50;
            color: white;
            position: absolute;
            right: 0;
            top: 30px;
        }

        /* Popup */
        .popup {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            width: 300px;
            height: 300px;
            background: white;
            border-radius: 30px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 24px;
        }

        .popup-content p {
            font-size: 18px;
        }

        .popup-content button {
            background: #25D366;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 14px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Pio itu cantik atau jelek?</h1>

    <div class="buttons" id="area">
        <button id="jelek">Jelek</button>
        <button id="cantik">Cantik</button>
    </div>
</div>

<!-- Popup -->
<div class="popup" id="popup">
    <div class="popup-content">
        <p>
            nah gitu dong mengakui😁<br>
            klik kirim pesan sekarang ke adam, untuk mengakui.
        </p>
        <button id="kirim">Kirim Pesan</button>
    </div>
</div>

<!-- Sound -->
<audio id="soundJelek" src="assets/audio/dodge.mp3"></audio>
<audio id="soundCantik" src="assets/audio/success.mp3"></audio>

<script src="assets/js/confetti.js"></script>

<script>
    const jelekBtn = document.getElementById("jelek");
    const cantikBtn = document.getElementById("cantik");
    const popup = document.getElementById("popup");
    const kirimBtn = document.getElementById("kirim");
    const area = document.getElementById("area");

    const soundJelek = document.getElementById("soundJelek");
    const soundCantik = document.getElementById("soundCantik");

    jelekBtn.addEventListener("mouseenter", pindah);
    jelekBtn.addEventListener("touchstart", pindah);

    function pindah() {
        soundJelek.currentTime = 0;
        soundJelek.play();

        const areaRect = area.getBoundingClientRect();

        // wilayah kiri saja (aman dari tombol cantik)
        const maxX = areaRect.width / 2 - jelekBtn.offsetWidth;
        const maxY = areaRect.height - jelekBtn.offsetHeight;

        const x = Math.random() * maxX;
        const y = Math.random() * maxY;

        jelekBtn.style.left = `${x}px`;
        jelekBtn.style.top = `${y}px`;
    }

    cantikBtn.addEventListener("click", () => {
        soundCantik.play();
        popup.style.display = "flex";

        confetti({
            particleCount: 120,
            angle: 60,
            spread: 80,
            origin: { x: 0 }
        });

        confetti({
            particleCount: 120,
            angle: 120,
            spread: 80,
            origin: { x: 1 }
        });
    });

    kirimBtn.addEventListener("click", () => {
        const nomor = "628137902804";
        const pesan = encodeURIComponent("Iya papa sayang, mama cantik kok ❤️");
        window.location.href = `https://wa.me/${nomor}?text=${pesan}`;
    });

    popup.addEventListener("click", (e) => {
        if (e.target === popup) popup.style.display = "none";
    });
</script>

</body>
</html>
